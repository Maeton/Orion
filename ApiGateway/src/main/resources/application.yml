server:
  port: 8000

spring:
  application:
    name: ApiGateway

  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]': ## aplica a todas las rutas
                allowed-origin-patterns: "*"
                allowed-methods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS # React
                  - PATCH
                allowed-headers: "*"
                allow-credentials: true

          routes:

            - id: usuario-service
              uri: http://user-service:9090
              predicates:
                - Path=/api/usuarios/**, /api/auth/**
            - id: comentario-service
              uri: http://comentario-service:8008
              predicates:
                - Path=/api/comentarios/**


            - id: post-service
              uri: http://post-service:9091
              predicates:
                - Path=/api/posts/**

            - id: media-service
              uri: http://media-service:9093
              predicates:

                - Path=/api/media/**


            - id: eventos-service
              uri: http://eventos-service:9096
              predicates:
                - Path=/api/eventos/**


            - id: interacciones_service
              uri: http://interaccion-service:9095
              predicates:
                - Path=/api/interacciones/**

            - id: chat-service
              uri: http://chat-service:9100
              predicates:
                - Path=/api/chat/**, /ws-chat/**


            - id: grupos-service
              uri: http://grupos-service:9092
              predicates:
                - Path=/api/grupos/**

          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE